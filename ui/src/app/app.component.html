<header class="shell">
  <h1>BrawlEngine</h1>
  <nav>
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="tab"
        [class.active]="activeTabId() === tab.id"
        (click)="selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </nav>
  <p class="status">{{ hostStatus() }}</p>
</header>
<section class="game">
  <p class="path">{{ gamePath() }}</p>
  <button type="button" (click)="chooseFolder()" [disabled]="shellBusy()">
    Choose folder
  </button>
  <button type="button" (click)="resetAll()" [disabled]="shellBusy()">
    Reset all
  </button>
  <button type="button" (click)="reapply()" [disabled]="shellBusy()">
    Reapply
  </button>
  @if (runningMessage(); as warn) {
    <p class="warn">{{ warn }}</p>
  }
  @if (actionMessage(); as note) {
    <p class="action">{{ note }}</p>
  }
</section>
<main>
  <ng-container [ngComponentOutlet]="activeTabComponent()" />
</main>
