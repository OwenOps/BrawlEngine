<header class="shell">
  <h1>BrawlEngine</h1>
  <nav>
    <a routerLink="/maps" routerLinkActive="active">Maps</a>
    <a routerLink="/musiques" routerLinkActive="active">Musiques</a>
  </nav>
  <p class="status">{{ hostStatus }}</p>
</header>
<section class="game">
  <p class="path">{{ gamePath }}</p>
  <button type="button" (click)="chooseFolder()" [disabled]="picking">Choose folder</button>
  @if (runningMessage) {
    <p class="warn">{{ runningMessage }}</p>
  }
</section>
<main>
  <router-outlet />
</main>
