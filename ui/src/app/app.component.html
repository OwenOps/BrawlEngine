<header class="shell">
  <h1>BrawlEngine</h1>
  <nav>
    @for (tab of tabs; track tab.id) {
      <button type="button" class="tab" [class.active]="activeTabId === tab.id" (click)="activeTabId = tab.id">{{ tab.label }}</button>
    }
  </nav>
  <p class="status">{{ hostStatus }}</p>
</header>
<section class="game">
  <p class="path">{{ gamePath }}</p>
  <button type="button" (click)="chooseFolder()" [disabled]="picking">Choose folder</button>
  @if (runningMessage) {
    <p class="warn">{{ runningMessage }}</p>
  }
</section>
<main>
  <ng-container *ngComponentOutlet="activeTabComponent" />
</main>
