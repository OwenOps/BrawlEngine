<h2>Maps</h2>
<p class="hint">Brawlhalla Realms from GameBanana. Download / Apply comes next.</p>
@if (error) {
  <p class="error">{{ error }}</p>
}
@if (loading && items.length === 0) {
  <p>Loading…</p>
}
<div class="grid">
  @for (mod of items; track mod.id) {
    <article class="card">
      @if (mod.thumbnailUrl) {
        <img [src]="mod.thumbnailUrl" [alt]="mod.name" />
      }
      <h3>{{ mod.name }}</h3>
      <p>{{ mod.author }}</p>
    </article>
  }
</div>
@if (!complete && !error) {
  <button type="button" (click)="loadMore()" [disabled]="loading">
    {{ loading ? 'Loading…' : 'Load more' }}
  </button>
}
