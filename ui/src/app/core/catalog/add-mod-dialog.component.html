@if (open()) {
  <div class="overlay" (click)="requestClose()">
    <div
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="add-mod-title"
      (click)="$event.stopPropagation()"
    >
      <h2 id="add-mod-title">{{ heading() }}</h2>
      <p class="hint">{{ hint() }}</p>
      <input
        class="add-mod-field"
        type="text"
        [value]="typed()"
        [attr.placeholder]="example()"
        aria-label="GameBanana URL or id"
        (input)="setTyped($event)"
        (keydown.enter)="confirm()"
      />
      @if (error(); as text) {
        <p class="warn">{{ text }}</p>
      }
      <div class="sheet-actions">
        <button type="button" class="primary" (click)="confirm()">
          {{ confirmLabel() }}
        </button>
        <button type="button" (click)="requestClose()">Cancel</button>
      </div>
    </div>
  </div>
}
