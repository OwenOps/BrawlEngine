<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BrawlEngine</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    html, body { margin: 0; background: #0d0f13; }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #0d0f13;
      color: #eceef1;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #boot img { width: 72px; height: 72px; }
    #boot p { margin: 0; color: #8b93a3; }
    .boot-spin {
      width: 28px;
      height: 28px;
      border: 3px solid #262b34;
      border-top-color: #4c8dff;
      border-radius: 50%;
      animation: boot-spin 0.7s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <img src="logo.png" alt="BrawlEngine" />
    <span class="boot-spin" aria-hidden="true"></span>
    <p>Starting…</p>
  </div>
  <app-root></app-root>
  <script>
    document.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    });
  </script>
</body>
</html>
